[package]
name = "pdv-suite"
version = "0.1.0"
description = "PDV Suite Tauri App"
authors = ["Seu Nome"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }                # sem features "macros"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mysql = "25"
tokio = { version = "1", features = ["full"] }

[profile.release]
opt-level = "s"
